<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peak Craft Club</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav>
        <img src="assets/logo+text.png" alt="PeakCraft Logo" class="nav-logo" />
        <ul>
          <div class="nav-link-container">
            <li><a href="#about">About Us</a></li>
          </div>
          <div class="nav-link-container">
            <li><a href="#events">Events</a></li>
          </div>
          <div class="nav-link-container">
            <li><a href="#projects">Projects</a></li>
          </div>
          <div class="nav-link-container">
            <li><a href="#domains">Domains</a></li>
          </div>
          <div class="nav-link-container" id="join-us-container">
            <li><a href="#join">Join Us</a></li>
          </div>
        </ul>
      </nav>

      <section id="hero">
        <div class="hero">
          <div class="hero-texts">
            <img src="assets/Motto-Large.png" alt="PeakCraft-Motto" />
            <p>
              Join Hawassa University's vibrant community, where bold ideas
              <br />
              spark, teamwork thrives, and we rise together!
            </p>
          </div>
          <div class="hero-buttons">
            <div class="apply-button">Apply</div>
            <div class="learn-more-button">Learn more</div>
          </div>
        </div>
      </section>
      <div class="hero-bottom-line">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
      </div>
    </header>

    <section id="about"></section>

    <section id="domains"></section>

    <section id="events"></section>

    <section id="projects"></section>

    <section id="join"></section>

    <footer>
      <p>
        &copy; 2024 Peak Craft Entity of Hawassa University. All rights
        reserved.
      </p>
    </footer>

    <script src="scripts.js"></script>
  </body>
</html>
